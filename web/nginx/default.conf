# Static host for the SPA plus a reverse proxy to the API.
#
# TLS is expected to terminate in front of this container — an AWS ALB with an
# ACM certificate, or CloudFront. For a standalone box holding its own
# certificate, see tls.conf.example next to this file.

# The scheme the *client* used. Behind a load balancer that only survives in
# X-Forwarded-Proto; when this container terminates TLS itself, $scheme has it.
map $http_x_forwarded_proto $forwarded_proto {
  ''      $scheme;
  default $http_x_forwarded_proto;
}

# HSTS is only meaningful, and only safe, on a connection that really was TLS.
# Nginx omits a header whose value is empty, so this is a no-op on plain HTTP.
map $forwarded_proto $hsts_value {
  https   'max-age=31536000; includeSubDomains';
  default '';
}

upstream api_upstream {
  server api:4000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 4m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Load balancer target check. Answered by Nginx alone, so it reports whether
  # the web tier is up without waking the API or filling the access log.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build assets never change under the same name.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control 'public, max-age=31536000, immutable' always;
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control 'no-cache' always;
  }

  location /api/ {
    # No security headers here: helmet sets them on the API's own responses, and
    # a second, conflicting X-Frame-Options makes browsers ignore both.
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection '';
    proxy_read_timeout 30s;
  }

  location /uploads/ {
    # The API stamps its own caching and nosniff headers on these files. Hide
    # them so the values set here are the only ones on the wire.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Cache-Control;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control 'public, max-age=2592000, immutable' always;
    proxy_pass http://api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # SPA fallback: every unknown path renders the app, which shows the 404 page.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
