# Included by every location that Nginx answers itself.
#
# `add_header` does not merge across levels: the moment a location declares one
# of its own, it stops inheriting the server-level set. That is why these live in
# a snippet and are included per location instead of being written once at the
# top — without it the SPA's own index.html shipped with no security headers at
# all, which is precisely the response where they matter most.
#
# Not included under /api: the API sets its own via helmet, and two conflicting
# X-Frame-Options headers make browsers ignore both.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# The document CSP. Everything the SPA loads is same-origin and hashed at build
# time, so 'self' is enough for scripts; styles need 'unsafe-inline' for the
# noscript block and React's style attributes. `img-src https:` allows project
# thumbnails the admin pastes in from elsewhere.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

# Empty when the request did not arrive over TLS, and Nginx omits headers whose
# value is empty — so this is a no-op on plain HTTP and set once behind an ALB.
add_header Strict-Transport-Security $hsts_value always;
